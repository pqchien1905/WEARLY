name: nep_storefront
description: Wearly fashion commerce Flutter Web frontend demonstration.
publish_to: none
version: 1.0.0+1
environment:
  sdk: '>=3.10.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.0.0
  go_router: ^17.0.0
  file_selector: ^1.0.4
  cupertino_icons: ^1.0.8
  http: ^1.6.0
  http_parser: ^4.1.2
  uuid: ^4.5.3
dev_dependencies:
  file_selector_platform_interface: 2.7.0
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/images/
  fonts:
    - family: BeVietnamPro
      fonts:
        - asset: assets/fonts/BeVietnamPro-Regular.ttf
        - asset: assets/fonts/BeVietnamPro-Medium.ttf
          weight: 500
        - asset: assets/fonts/BeVietnamPro-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/BeVietnamPro-Bold.ttf
          weight: 700
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope.ttf
    # The web engine requests a default Roboto family. Alias it locally so
    # the demo does not fetch a fallback font from a third-party server.
    - family: Roboto
      fonts:
        - asset: assets/fonts/BeVietnamPro-Regular.ttf
